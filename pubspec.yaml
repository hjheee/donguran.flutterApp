name: donguran
description: 여행 동행 매칭 + AI 플래너 앱
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  freezed_annotation: ^2.4.4
  go_router: ^14.6.2
  json_annotation: ^4.9.0
  riverpod_annotation: ^2.6.1

dev_dependencies:
  build_runner: ^2.4.13
  custom_lint: ^0.7.0
  flutter_test:
    sdk: flutter
  freezed: ^2.5.7
  json_serializable: ^6.9.0
  riverpod_generator: ^2.6.3
  riverpod_lint: ^2.6.3
  very_good_analysis: ^7.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: GothicA1
      fonts:
        - asset: assets/fonts/GothicA1-Light.ttf
          weight: 300
        - asset: assets/fonts/GothicA1-Regular.ttf
          weight: 400
        - asset: assets/fonts/GothicA1-Medium.ttf
          weight: 500
        - asset: assets/fonts/GothicA1-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/GothicA1-Black.ttf
          weight: 900
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Light.ttf
          weight: 300
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-ExtraBold.ttf
          weight: 800

# custom_lint/riverpod_lint 0.7.x 와 riverpod_generator 2.6 이 요구하는 analyzer 버전이 충돌해
# build_runner 가 precompile 에 실패한다(2026-09-29). 아래 조합은 함께 동작이 확인된 세트.
# custom_lint/riverpod_lint 를 올려 analyzer 를 자체 해석하게 되면 이 블록을 제거한다.
dependency_overrides:
  analyzer: 7.7.1
  analyzer_plugin: 0.13.4
  custom_lint_visitor: 1.0.0+7.7.0
